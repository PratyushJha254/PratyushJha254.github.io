<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A vortex core: the four phases of the spin-angle colour map meeting at a point. -->
  <clipPath id="c"><rect width="32" height="32" rx="6"/></clipPath>
  <g clip-path="url(#c)">
    <rect width="16" height="16" fill="#e2d9e2"/>
    <rect x="16" width="16" height="16" fill="#6276ba"/>
    <rect x="16" y="16" width="16" height="16" fill="#2f1436"/>
    <rect y="16" width="16" height="16" fill="#b25652"/>
  </g>
  <circle cx="16" cy="16" r="4.5" fill="#fff" stroke="#2f1436" stroke-width="2"/>
</svg>
