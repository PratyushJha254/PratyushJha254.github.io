# Site settings. Everything about you lives in _data/*.yml, not here.

title: Pratyush Jha
tagline: Statistical physics of generative models
description: >-
  Pratyush Jha is a pre-doctoral researcher at the Indian Institute of Science,
  Bangalore, working on the statistical physics of generative models.
author: Pratyush Jha
lang: en

# GitHub Pages fills in `url` and `baseurl` by itself, so they are left out.
# Set them only if you move the site to a custom domain or another host:
# url: "https://example.com"
# baseurl: ""

# Post dates are read in this timezone. A post dated in the future is not
# published until that date arrives.
timezone: Asia/Kolkata

permalink: /blog/:year/:month/:title/

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math: true
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Comments under blog posts, through giscus (https://giscus.app). Readers sign
# in with GitHub and comments are stored in the repository's Discussions.
# They stay switched off until all four values are filled in; the README
# explains where the two ids come from.
comments:
  repo: "pratyushjha254/preview-repo"          # for example pratyushjha254/pratyushjha254.github.io
  repo_id: "R_kgDOU75odg"
  category: Announcements
  category_id: "DIC_kwDOU75ods4DHDjg"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
