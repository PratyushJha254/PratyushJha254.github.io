# The "About" section on the home page. Markdown; leave a blank line between
# paragraphs.
about: |
  I'm a pre-doctoral researcher at the Indian Institute of Science, Bangalore,
  working with Prof. Rahul Pandit. My work sits at the intersection of statistical physics
  and machine learning. I take physical systems whose statistics are known
  exactly or characterized well, such as spin models and turbulent flows, and
  use them as controlled testbeds for generative models. I am also interested in using 
  statistical physics to uncover the learning dynamics of AI Models. Recently, I have
  trained diffusion models on non-reciprocal turbulence, and on the 2D XY
  model, where diffusing directly on the torus reproduces the heat capacity
  across the BKT transition.

  Before IISc, I spent a year and a half as an AI engineer at Ola Krutrim,
  where I fine-tuned LLaMA-3 with LoRA and preference optimization, and built
  production systems for retrieval-augmented generation, model serving, and
  video analytics. I studied Engineering Physics at IIT Roorkee, graduating with 
  second rank in my department.

  If you work on related problems, or would simply like to talk about physics
  and machine learning, I would be glad to hear from you.

# Opens the Experience page.
interests: >-
  Statistical physics of generative models; using physical systems with exactly
  known or well-characterized statistics (spin models, turbulence) as controlled
  testbeds for what neural networks learn and where they fail; scientific
  machine learning.

