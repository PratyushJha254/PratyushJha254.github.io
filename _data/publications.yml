# Papers, newest first. The order here is the order on the site.
#
# id        a short key; experience.yml refers to papers by it
# authors   as they should appear; your own name is set in bold automatically.
#           Add * after a name to mark equal contribution.
# venue     journal, conference, or "Preprint"
# date      shown after the venue, for example "Aug 2026"
# year      groups papers by year
# arxiv     the arXiv number only, in quotes
# doi       the DOI only, without https://doi.org/
# url       any other link (used when there is no arXiv number or DOI)
# pdf, code optional links
# abstract  optional; adds an "Abstract" button
# note      optional remark shown after the venue
# bibtex    optional; adds a "Cite" button

