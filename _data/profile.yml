# The sentence under your name and photo.
tagline: >-
  I work at the intersection of physics and machine learning: using statistical physics 
  to make generative models more interpretable and robust, and using those models to simulate physics.

# The "About" section on the home page. Markdown; leave a blank line between
# paragraphs.
about: |
  I'm a pre-doctoral researcher at the **Indian Institute of Science
  (IISc), Bangalore**, working with Prof. Rahul Pandit. My research focuses on
  the robust analysis and development of **machine-learning models using
  statistical physics**, and on using these models to **capture physics
  faithfully**.

  I studied **Engineering Physics** at **IIT Roorkee**, graduating **second in
  my department**. My bachelor's thesis used deep learning to study phase
  transitions in Ising models, as a step toward simulating frustrated
  Josephson-junction arrays. During my bachelor's, I was a **MITACS Globalink
  research intern at McGill University** with Prof. John Kildea, where I worked
  on Monte Carlo simulations of CR-39 neutron detectors in TOPAS (built on
  Geant4).

  Before joining Prof. Pandit at IISc, I spent a year and a half in industry at
  **Ola Krutrim**, fine-tuning and aligning LLMs and building production AI
  systems.

  If you work on related problems, I would be glad to hear from you.

# Opens the Experience page.
interests: >-
  Physics and machine learning: robust analysis and development of
  generative models using statistical physics, and the use of these models to
  capture physics faithfully.

